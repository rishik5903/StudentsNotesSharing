# ============================================================
# CampusNotes — application.properties
# Spring Boot Configuration
# ============================================================
#
# HOW TO SET YOUR MYSQL CREDENTIALS
# ----------------------------------
# Option 1 (Recommended): Environment variables
#   Export these before running the backend:
#       export DB_USERNAME=your_mysql_username
#       export DB_PASSWORD=your_mysql_password
#   Then run: mvn spring-boot:run
#
# Option 2: Edit directly below (NOT recommended for git commits)
#   Replace ${DB_USERNAME:campusnotes_user} with your username
#   Replace ${DB_PASSWORD:changeme}         with your password
#
# ============================================================

# ----- Server -----
server.port=8080

# ----- MySQL DataSource -----
spring.datasource.url=jdbc:mysql://localhost:3306/student_notes_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=Rishik
spring.datasource.password=Rishik@5903
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- JPA / Hibernate -----
# validate   — checks schema matches entities (use in production)
# update     — auto-creates / alters tables (convenient during development)
# create     — drops and recreates tables on every start (DANGER: loses data)
# none       — does nothing (for when schema.sql is managed manually)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ----- File Upload -----
# Maximum size for a single uploaded file
spring.servlet.multipart.max-file-size=15MB
# Maximum size for the entire multipart request
spring.servlet.multipart.max-request-size=16MB

# ----- Custom Application Properties -----
# Directory where uploaded PDFs will be stored
# Can be an absolute path, e.g.: /Users/yourname/campusnotes-uploads
app.upload.dir=uploads

# ----- Logging -----
logging.level.com.campusnotes=DEBUG
logging.level.org.springframework.web=INFO

